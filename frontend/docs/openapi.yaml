    DiscussionReply:
      type: object
      required:
        - id
        - author
        - body
        - createdAt
        - isOwn
        - isSeed
      properties:
        id:
          type: string
          maxLength: 120
        author:
          type: string
          maxLength: 80
          description: 현재 고정 예시 작성자 또는 나 (데모). 계정 인증 정보가 아니다.
        body:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S
          description: 앞뒤 공백 제거 후 1~1000 UTF-16 code unit. 일반 텍스트이며 HTML이 아니다.
          x-length-unit: utf16-code-units
        createdAt:
          type: string
          format: date-time
          description: 예시는 2025-06-24, 사용자 로컬 입력은 브라우저 현재 ISO 시각. 사건 asOf 이후일 수 있다.
        isOwn:
          type: boolean
          description: 내 브라우저 작성 표시. 권한이나 신원 증명이 아니다.
        isSeed:
          type: boolean
          description: 기본 예시 글/답글 여부.
    DiscussionThread:
      allOf:
        - $ref: "#/components/schemas/DiscussionReply"
        - type: object
          required:
