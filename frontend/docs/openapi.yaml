            title: 호르무즈 해협의 첫 편집 상승
            body: 기준선과 비교한 편집량 변화가 사건 후보의 출발점이 되었습니다.
            kind: signal
            entityId: strait-of-hormuz
        news:
          - id: hormuz-news-1
            title: 호르무즈 해협을 통해 읽는 원유 운송 경로
            source: 데모 뉴스
            publishedAt: "2025-06-24T09:20:00+09:00"
            type: news
            url: https://en.wikipedia.org/wiki/Strait_of_Hormuz
            summary: "가상 기사 요약: 주요 항로와 주변 해역을 연결해 에너지 운송의 구조를 설명합니다. 링크는 주제 참고 문서입니다."
          - id: hormuz-news-2
            title: 해상 교역 지표를 확인하는 방법
            source: 기관 발표 예시
            publishedAt: "2025-06-23T16:10:00+09:00"
            type: official
            url: https://en.wikipedia.org/wiki/Maritime_transport
            summary: 기관 자료 형식을 보여 주는 예시입니다. 통항량·운송량·집계 시점을 각각 확인하도록 구성했습니다.
          - id: hormuz-news-3
            title: 지역 이슈와 에너지 기업 사이의 연결 고리
            source: 데모 분석
            publishedAt: "2025-06-23T11:30:00+09:00"
            type: analysis
            url: https://en.wikipedia.org/wiki/Petroleum_industry
            summary: "가상 분석: 정유·생산·운송 사업은 서로 다른 맥락을 가집니다. 이 연결만으로 가격 방향을 판단할 수는 없습니다."
