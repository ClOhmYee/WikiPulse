          - title: 한 문서의 급증에서 함께 움직이는 주제로
            body: 해협 문서의 활동과 이란·석유 문서의 동시 변화를 함께 보여 줍니다. 데모 편집량을 합산한 Pulse로 사건의 관심도를 비교할 수 있습니다.
