# WikiPulse 백엔드 (WP-36)
#
# 스키마는 이 애플리케이션이 소유하지 않는다. db/migrations 가 정본이고
# JPA 는 검증만 한다(validate). 엔티티가 실제 테이블과 어긋나면 기동 때 걸린다.
# 마이그레이션 도구(Flyway/Liquibase) 확정은 별도 — db MR 참고.

spring:
  application:
    name: wikipulse-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wikipulse}
    username: ${DB_USER:wikipulse}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# actuator 는 헬스체크만 노출한다.
management:
  endpoints:
    web:
      exposure:
        include: health

# 이슈-종목 후보 생성 워커 (WP-67, 명세 §6.3).
# K·lift 컷은 WP-22 확정값(임베딩 20 / GDELT 10). 폴러는 기본 꺼짐 —
# 서버에서 LLM_GATEWAY_KEY 를 넣고 scheduler.enabled=true 로 켠다.
# 🔴 폴러는 종목 임베딩(WP-34) 전량 적재 후에 켠다(StockCandidateWorker 순서 계약).
wikipulse:
  matching:
    embedding-top-k: 20
    gdelt-top-k: 10
    max-chars: 2000
    wikipedia:
      # 🔴 타임아웃 필수 — 소켓 hang 이 단일 스케줄러 스레드를 영구 정지시킨다.
      connect-timeout: 5s
      read-timeout: 10s
    gateway:
      api-key: ${LLM_GATEWAY_KEY:}
      connect-timeout: 5s
      # read 는 게이트웨이 p99 지연을 덮게(페이로드는 항상 작다).
      read-timeout: 30s
      # LLM 검증(WP-68·-172). 🔴 이름이 claude- 로 시작하면 Anthropic, 아니면 OpenAI
      #    경로로 나간다. 되돌리려면 claude-sonnet-4-5-20250929 을 넣는다.
      #    ~~claude-sonnet-4-5-20250929~~ → gpt-5.4-nano (2026-09-21, -170 실측):
      #    정답셋 3사례 36건에서 32건 정답·오탐 0, Sonnet 대비 9.8배 저렴(이슈당 1,317 → 134).
      #    근거 ai/llm-verify-batch-poc/RESULT.md
      verification-model: ${WIKIPULSE_MATCHING_GATEWAY_VERIFICATIONMODEL:gpt-5.4-nano}
      # 이슈 요약(-119)은 검증과 모델을 분리한다 — 🔴 요약은 nano 로 재지 않았다.
      #    한 노브를 공유하면 검증을 내리는 순간 요약 품질이 측정 없이 같이 바뀐다.
      summary-model: ${WIKIPULSE_MATCHING_GATEWAY_SUMMARYMODEL:claude-sonnet-4-5-20250929}
      # 응답은 6필드 JSON. 한국어 rationale 절단 방지 마진(상한만 늘 뿐 짧은 응답엔 무영향).
      verification-max-tokens: 800
      # 이슈 요약(WP-119) 전용 상한. 검증과 분리해 한쪽 튜닝이 다른 쪽을 절단시키지 않게 한다.
      summary-max-tokens: 800
    scheduler:
      enabled: ${WIKIPULSE_MATCHING_SCHEDULER_ENABLED:false}
      fixed-delay: PT5M
      batch-size: 20
      # 🔴 **실제 비용 상한은 batch-size 가 아니라 이 값이다** (WP-176).
      #    batch-size 는 한 폴의 크기일 뿐이라 폴을 반복하면 미처리 클러스터 전체를 훑는다.
      #    후보 생성 자체는 임베딩이라 싸지만, verification.enabled 가 켜져 있으면 후보가
      #    생기는 즉시 LLM 검증이 따라붙는다 — 거기가 비싼 쪽이다.
      # 🔴 summary.top-per-snapshot 과 **같은 값**이어야 한다. 다르면 같은 화면에서
      #    요약은 있는데 종목이 없거나 그 반대가 생긴다.
      #    0 = 무제한. ⚠️ 0 으로 두기 전에 운영 DB 로 예상 호출 수를 세어 본다.
      top-per-snapshot: ${WIKIPULSE_MATCHING_SCHEDULER_TOPPERSNAPSHOT:10}
      # 대상을 한 출처로 좁힌다 (WP-168). 빈 값 = 전체(기존 동작).
      # 🔴 폴러는 snapshot_ts DESC 로 집는다 — LIVE 가 쌓이는 동안 과거 replay 구간에는
      #    영원히 닿지 못한다. 특정 구간을 먼저 채우려면 replay 로 좁힌다.
      # 🔴 summary.source 와 **같은 값**이어야 한다 (top-per-snapshot 과 같은 제약).
      source: ${WIKIPULSE_MATCHING_SCHEDULER_SOURCE:}
    # LLM 검증 워커 (WP-68, 명세 §6.3). 후보 생성 폴러와 별개로 켠다 —
    # PENDING 후보가 쌓인 뒤에 켠다.
    verification:
      enabled: ${WIKIPULSE_MATCHING_VERIFICATION_ENABLED:false}
      fixed-delay: PT5M
      batch-size: 20
      org-context-limit: 15
      # 3등급(EMBEDDING_ONLY) 발동 문턱 — 1·2등급 확정 통과가 이 값 미만일 때만(WP-22).
      tier3-threshold: 2
    # 하루에 쓸 수 있는 LLM 호출 수 (WP-191).
    # 🔴 이미 있는 상한들과 축이 다르다 — top-per-snapshot 은 스냅샷당, summary.max-attempts 는
    #    클러스터당, 이건 하루에 몇 번이다. 셋 다 필요하다.
    # 크레딧이 아니라 호출 수로 묶는다: 크레딧은 GATEWAY key-info 를 주기적으로 읽어야 하는데
    #    값이 지연되고 소액 호출은 델타가 0 으로 반올림된다(-170 실측).
    # 환산 (2026-09-21, -170): 검증 nano 호출당 약 9 · 요약 1회 41~62 크레딧.
    #    기본값이면 하루 최대 약 5,200(요약) + 2,700(검증) = 7,900 크레딧.
    # 🔴 요약과 검증을 나눈다 — 한 통이면 검증이 요약을 굶는다(이슈당 검증은 후보 수만큼,
    #    요약은 1회).
    # 0 이하 = 무제한. ⚠️ 켜지 말 것.
    budget:
      summary-calls: ${WIKIPULSE_MATCHING_BUDGET_SUMMARYCALLS:100}
      verification-calls: ${WIKIPULSE_MATCHING_BUDGET_VERIFICATIONCALLS:300}
    # 이슈 요약 writer·상태 전이 워커 (WP-119, 명세 §3.2 7번). 검증 워커와 별개로 켠다 —
    # 검증과 같은 gateway 계층·모델을 재사용한다(새 GATEWAY 설정 없음).
    summary:
      enabled: ${WIKIPULSE_MATCHING_SUMMARY_ENABLED:false}
      fixed-delay: PT5M
      batch-size: 20
      # 🔴 **실제 비용 상한은 batch-size 가 아니라 이 값이다** (WP-165).
      #    batch-size 는 한 폴의 크기일 뿐이라 폴을 반복하면 미처리 클러스터 전체를 훑는다.
      #    스냅샷별 pulse_score 상위 N 만 요약하므로 LLM 실호출은 최대 스냅샷 수 × N 이다.
      #    상위 N 을 고르는 축이 화면 정렬(pulse_score DESC)과 같다 — 보여주는 것만 요약한다.
      #    같은 issue_key 요약이 이미 있으면 복사(LLM 0)라 이 상한과 무관하게 채운다.
      #    0 = 무제한. ⚠️ 무제한으로 두기 전에 운영 DB 로 예상 호출 수를 세어 본다.
      top-per-snapshot: ${WIKIPULSE_MATCHING_SUMMARY_TOPPERSNAPSHOT:10}
      # 🔴 scheduler.source 와 **같은 값**이어야 한다. 근거는 그쪽 주석.
      source: ${WIKIPULSE_MATCHING_SUMMARY_SOURCE:}
      # 같은 model 로 요약 저장에 실패해도 되는 횟수 (WP-182).
      # 🔴 top-per-snapshot 은 이걸 못 막는다 — 그건 "몇 개를 고르나"이고 이건 "같은 것을
      #    몇 번 시도하나"다. 저장 못 하는 클러스터는 issue_report 가 계속 비어 매 폴 다시
      #    집히고 LLM 은 매번 호출된다. 2026-09-22 운영에서 51분에 5,414 크레딧이 이렇게 샜다.
      # 0 이하 = 무제한. ⚠️ 켜지 말 것 — 이 이슈 이전 동작으로 돌아간다.
      max-attempts: ${WIKIPULSE_MATCHING_SUMMARY_MAXATTEMPTS:3}
  # 문서 표시용 한국어 제목 채우기 (V20). 매칭과 무관해 prefix 를 분리했다 —
  # 매칭 폴러를 켜고 끄는 것과 독립으로 켜고 꺼야 한다.
  # 🔴 기본 꺼짐. GATEWAY 와 달리 크레딧은 안 쓰지만(위키미디어 무료), 켜는 순간이 곧 백필 시작이다.
  # 🔴 폴당 위키 요청 수는 batch-size / 50 이다 — langlinks 는 한 요청에 제목 50개까지고
  #    51개부터는 잘림이 아니라 toomanyvalues 에러다(2026-09-22 실측).
  #    기본 500 이면 폴당 10 요청으로 resilience4j wikipedia RateLimiter(초당 10)와 같은 자릿수다.
  # 대상은 cluster_member 에 편입된 enwiki 문서 중 아직 조회 안 한 것뿐이다 —
  #    wiki_page 전수(조회수 덤프가 만든 수백만 행)를 훑지 않는다.
  page-title:
    enabled: ${WIKIPULSE_PAGETITLE_ENABLED:false}
    fixed-delay: PT10M
    batch-size: ${WIKIPULSE_PAGETITLE_BATCHSIZE:500}
    # 2단 폴백 — Azure Translator (en->ko). ko.wikipedia 대응 문서가 **없는** 문서만 번역한다.
    # 🔴 키는 저장소에 넣지 않는다. 비어 있으면 번역 단계를 통째로 건너뛰고 영문으로 표시한다
    #    — 기능이 깨지지 않는다. 운영에서만 AZURE_TRANSLATOR_KEY 를 주입한다.
    # 🔴 번역 결과는 **표시·검색 전용**이다. ko.wikipedia 정식 제목이 아니므로 위키 링크를
    #    이 값으로 만들지 않는다(title_ko 와 컬럼을 나눈 이유).
    # F0 는 월 200만 자다. batch-size 를 위키 조회와 따로 두는 이유 — 번역만 쿼터를 쓴다.
    azure:
      key: ${AZURE_TRANSLATOR_KEY:}
      endpoint: ${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}
      region: ${AZURE_TRANSLATOR_REGION:}
      connect-timeout: 5s
      read-timeout: 10s
      batch-size: ${AZURE_TRANSLATOR_BATCHSIZE:200}

# 외부 호출 신뢰성 계층 (WP-66). named instance gateway / wikipedia.
# 전송 계층 실패만 다룬다(타임아웃·5xx·429·연결오류·회로개방). 스키마 검증·attempt_count·
# check_state 전이는 −68 몫이라 여기 없다.
# ⚠️ @TimeLimiter 는 없다 — resilience4j TimeLimiter 는 CompletableFuture 반환에만 동작하는데
#    두 클라이언트는 동기 반환이다. 단일 호출 최악 블록은 read-timeout × max-attempts + wait-duration
#    (GATEWAY ≈ 30s×2 + 0.5s ≈ 60.5s, wiki ≈ 10s×2 + 0.5s)까지 가지만, 반복되면 CircuitBreaker 가
#    열어 이후 폴은 빠른 실패로 막는다(근거는 matching/RESULT.md).
# 애스펙트 순서(resilience4j 기본): Retry(바깥) → CircuitBreaker → RateLimiter(안쪽).
#   Retry 가 fallback 을 소유해, 전이성만 재시도하고 소진 후에만 폴백을 부른다.
resilience4j:
  retry:
    instances:
      gateway:
        max-attempts: 2            # 초기 1 + 재시도 1
        wait-duration: 500ms
        retry-exceptions:
          - io.wikipulse.backend.matching.TransientUpstreamException
        # 🔴 HardUpstreamException(429·키만료·쿼터)은 여기 없다 → 재시도 안 함(공유 예산 보호).
      wikipedia:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - io.wikipulse.backend.matching.TransientUpstreamException
      # Azure Translator. 🔴 429 는 하드로 분류돼 여기 안 걸린다 — F0 는 쿼터 초과도 429 라
      #    재시도하면 남은 월 쿼터를 더 태운다(GATEWAY 와 같은 이유).
      azure:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - io.wikipulse.backend.matching.TransientUpstreamException
  circuitbreaker:
    instances:
      gateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5   # 5콜 미만이면 열지 않음(초기 blip 무시)
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          # 전이성·하드 둘 다 게이트웨이 불건강 신호 → 회로에 센다. 그 외(스키마/키/RL 거부)는 안 셈.
          - io.wikipulse.backend.matching.UpstreamTransportException
      wikipedia:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - io.wikipulse.backend.matching.UpstreamTransportException
      # 🔴 위키와 **분리된** 회로다. Azure 가 죽었다고 langlinks 조회까지 같이 막히면
      #    1단 폴백마저 멈춘다.
      azure:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - io.wikipulse.backend.matching.UpstreamTransportException
  ratelimiter:
    instances:
      gateway:
        # 공유 예산 폭주 상한. 단일 폴러라 평상시엔 안 걸리고, 오설정(과대 batch) 폭주만 캡.
        # timeout-duration 0 = 초과 시 대기 없이 즉시 거부 → 폴백 → 클러스터 PENDING.
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 0
      wikipedia:
        # 위키미디어 예절 — 초당 완만.
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
      # F0 쿼터 폭주 상한. 초과 시 대기 없이 거부 -> 폴백 -> 대상은 미번역으로 남아 다음 폴.
      azure:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
