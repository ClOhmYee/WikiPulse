name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/check_public_export.py --history
      - run: python tools/check_compose_env.py
      - name: Scan credentials
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          scanner_dir="$(mktemp -d)"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --retry 3 "${release}/gitleaks_${version}_linux_x64.tar.gz" -o "${scanner_dir}/gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "${release}/gitleaks_${version}_checksums.txt" -o "${scanner_dir}/checksums.txt"
          (cd "${scanner_dir}" && sha256sum --ignore-missing --check checksums.txt && tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks)
          "${scanner_dir}/gitleaks" git . --log-opts="--all --full-history" --max-archive-depth=3 --max-decode-depth=5 --ignore-gitleaks-allow --redact=100 --no-banner
          "${scanner_dir}/gitleaks" dir . --max-archive-depth=3 --max-decode-depth=5 --ignore-gitleaks-allow --redact=100 --no-banner
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:data
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
