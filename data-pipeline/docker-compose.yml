# 로컬 개발용 Kafka + Spark.
# EC2 실제 구축은 WP-26·-27 (팀원 5) 이고, 이건 그것과 별개로
# 각자 PC 에서 파이프라인을 돌려보기 위한 것이다.
#
#   docker compose up -d kafka
#   docker compose run --rm spark            # 스트리밍 잡 실행
#   docker compose --profile ui up -d        # Kafka UI 를 함께 띄운다

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: wikipulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      # 컨테이너 안(Spark)은 kafka:29092, 호스트(프로듀서)는 localhost:9092 로 붙는다.
      # 이 둘을 나누지 않으면 한쪽이 반드시 연결에 실패한다.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 브로커라 복제 계수는 전부 1. 운영 EC2 구성과 다르다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 명세 §5 — 재처리 창 7일
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  spark:
    image: apache/spark:3.5.3-python3
    container_name: wikipulse-spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wiki.edits
      WINDOW_SIZE: ${WINDOW_SIZE:-1 hour}
      SLIDE_SIZE: ${SLIDE_SIZE:-5 minutes}
      STARTING_OFFSETS: ${STARTING_OFFSETS:-latest}
      CHECKPOINT_DIR: /tmp/wikipulse-checkpoint
    volumes:
      - ./streaming:/opt/app/streaming:ro
      - spark-checkpoint:/tmp/wikipulse-checkpoint
    working_dir: /opt/app
    # --packages 는 첫 실행에서 의존성을 내려받는다. ivy 캐시를 볼륨에 두어
    # 두 번째부터는 건너뛴다.
    command: >
      /opt/spark/bin/spark-submit
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
        --conf spark.jars.ivy=/tmp/ivy
        streaming/edit_windows.py

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wikipulse-kafka-ui
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:
  spark-checkpoint:
