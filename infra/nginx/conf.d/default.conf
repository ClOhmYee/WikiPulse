# WikiPulse 리버스 프록시
# WebSocket 업그레이드용.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name service.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name service.example.com;

    # 처음엔 자체서명 더미. certbot 발급 후 같은 경로가 진짜로 바뀐다.
    ssl_certificate     /etc/letsencrypt/live/service.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;

    # --- API (docs/api-v0.1.md 기준 경로) ---
    # ⚠️ proxy_pass 에 호스트명을 직접 쓰면 nginx 가 기동 시 DNS 를 찾고,
    #    백엔드 컨테이너가 없으면 nginx 자체가 안 뜬다.
    #    변수로 쓰면 요청 시점에 찾으므로 백엔드가 없어도 nginx 는 살아 있다.
    location /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # 도커 내장 DNS
        set $backend_url http://backend:8080;
        proxy_pass $backend_url$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # --- 프론트엔드 정적 빌드 (SPA) ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
