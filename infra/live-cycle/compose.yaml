# LIVE 시간 주기 (WP-135). 대기 중인 윈도우의 조회수만 받아 재판정한다.
#
# 🔴 **서비스(기본) EC2 에서 돈다.** 추가 EC2 가 아니다. 이유 둘:
#    1. PostgreSQL 이 여기 있고 `wikipulse-net` 안에서 `postgres:5432` 로 붙는다.
#       추가 EC2 에서는 아직 못 붙는다 — 5432 가 사설망에 게시돼 있지 않다
#       (WP-143). 같은 호스트에 두면 그 문제를 아예 안 만난다.
#    2. Spark 잡이 아니다. 시간별 덤프를 받아 파싱하는 단일 파이썬 프로세스다.
#
# ⚠️ **중복 실행은 코드가 막는다.** spike/live_cycle.py 가 PostgreSQL advisory lock
#    을 잡는다 — 여러 호스트에서 떠도 하나만 실제로 돈다. 그래도 같은 파일을 두 번
#    받는 낭비가 없도록 한 군데서만 띄운다.

name: live-cycle

networks:
  wikipulse:
    external: true
    name: wikipulse-net

services:
  live-cycle:
    build:
      context: ${LIVE_CYCLE_APP_DIR:-../../data-pipeline}
    container_name: wikipulse-live-cycle
    networks: [wikipulse]
    init: true
    restart: ${RESTART_POLICY:-no}

    # t3 버스트다. 한 주기는 45 MB 짜리 시간별 덤프 몇 개를 풀어 훑는 일이라
    # 코어를 다 쓸 이유가 없다 — 백엔드와 같은 호스트라 크레딧을 나눠 쓴다.
    cpus: 1.0
    mem_limit: 1g

    environment:
      # ⚠️ 백엔드(infra/service)와 같은 값을 쓰되 이름이 다르다. 파이썬 쪽은
      #    DATABASE_URL 하나만 본다 (spike/live_cycle.py --dsn 기본값).
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-wikipulse}
      # 🔴 Wikimedia 는 연락처 없는 User-Agent 를 차단한다 (batch/ingest.py).
      CONTACT_EMAIL: ${CONTACT_EMAIL:?Set CONTACT_EMAIL in .env}
      DUMP_CACHE: /data/cache
      PAGEVIEW_HOURLY_OUT: /data/pageview-hourly

    volumes:
      - live-cycle-data:/data

    command:
      - python
      - -m
      - spike.live_cycle
      - --loop
      - --interval
      - "${LIVE_CYCLE_INTERVAL:-900}"
      - --max-hours
      - "${LIVE_CYCLE_MAX_HOURS:-6}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # ⚠️ 받은 덤프가 여기 쌓인다. 시간당 gz 약 45 MB → 하루 1 GB 남짓이고 지우는
  #    코드는 없다. 서비스 EC2 디스크를 주기적으로 본다 (`docker system df -v`).
  live-cycle-data:
