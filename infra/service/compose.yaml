name: service

networks:
  wikipulse:
    external: true
    name: wikipulse-net

services:
  backend:                      # ← nginx 가 http://backend:8080 으로 찾는 이름
    image: ${BACKEND_IMAGE:-wikipulse-backend:latest}
    restart: unless-stopped
    networks: [wikipulse]
    env_file: .env
    environment:
      # ⚠️ .env 는 POSTGRES_* 인데 백엔드가 읽는 이름은 다르다. 여기서 변환한다.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wikipulse}
      DB_USER:      ${POSTGRES_USER:-wikipulse}
      DB_PASSWORD:  ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-24h}
      LLM_GATEWAY_KEY:      ${LLM_GATEWAY_KEY:-}
      WIKIPULSE_MATCHING_SCHEDULER_ENABLED:    ${WIKIPULSE_MATCHING_SCHEDULER_ENABLED:-false}
      WIKIPULSE_MATCHING_VERIFICATION_ENABLED: ${WIKIPULSE_MATCHING_VERIFICATION_ENABLED:-false}
      WIKIPULSE_MATCHING_SUMMARY_ENABLED:      ${WIKIPULSE_MATCHING_SUMMARY_ENABLED:-false}
      # 🔴 **한 폴에 몇 클러스터를 집을지.** 기본 20 인데 LLM 검증은 **후보 하나당 1회**
      #    호출이라(`LlmVerifier` docstring) 클러스터 20개면 수백 회가 된다 — 크레딧이
      #    그만큼 나간다(2026-09-20 실측 환산: LLM 약 41 크레딧/회, 임베딩 0.04/건).
      #    부트스트랩처럼 대량 클러스터가 미처리로 쌓여 있을 때는 작게 잡고 지켜본다.
      #    폴러는 `snapshot_ts DESC` 순이라 작게 잡아도 최신 스냅샷 상위부터 집는다.
      WIKIPULSE_MATCHING_SCHEDULER_BATCHSIZE:    ${WIKIPULSE_MATCHING_SCHEDULER_BATCHSIZE:-20}
      # 🔴 후보 생성의 실제 비용 상한 (WP-176). 요약 쪽과 같은 값으로 둔다.
      WIKIPULSE_MATCHING_SCHEDULER_TOPPERSNAPSHOT: ${WIKIPULSE_MATCHING_SCHEDULER_TOPPERSNAPSHOT:-10}
      # 대상을 한 출처로 좁힌다 (WP-168). 빈 값 = 전체(기존 동작).
      # 🔴 폴러는 snapshot_ts DESC 로 집는다 — LIVE 가 매시간 쌓이는 동안 과거 replay
      #    구간에는 영원히 닿지 못한다. 골든데이처럼 특정 구간을 먼저 채우려면 replay 로 둔다.
      # 🔴 SUMMARY_SOURCE 와 **같은 값**이어야 한다. 한쪽만 좁히면 같은 화면에서 요약은
      #    있는데 종목이 없거나 그 반대가 생긴다.
      WIKIPULSE_MATCHING_SCHEDULER_SOURCE: ${WIKIPULSE_MATCHING_SCHEDULER_SOURCE:-}
      # 대상을 UTC 날짜 또는 스냅샷 시각으로 좁힌다 (WP-215). 예: 2026-07-17,2026-08-02T19:00
      #    검증 워커도 SCHEDULER_SOURCE·SCHEDULER_SNAPSHOT_DAYS 를 따른다.
      #    SOURCE 만으로는 replay 2개월 중 최신부터 집어 시연일에 닿기 전에 크레딧이 나간다.
      # 🔴 SUMMARY_SNAPSHOT_DAYS 와 **같은 값**이어야 한다. 빈 값 = 전체(기존 동작).
      WIKIPULSE_MATCHING_SCHEDULER_SNAPSHOT_DAYS: ${WIKIPULSE_MATCHING_SCHEDULER_SNAPSHOT_DAYS:-}
      WIKIPULSE_MATCHING_VERIFICATION_BATCHSIZE: ${WIKIPULSE_MATCHING_VERIFICATION_BATCHSIZE:-20}
      # 3등급 게이트 문턱. 0 = 끔(기본, WP-222). 2 로 두면 옛 동작(-22).
      WIKIPULSE_MATCHING_VERIFICATION_TIER3THRESHOLD: ${WIKIPULSE_MATCHING_VERIFICATION_TIER3THRESHOLD:-0}
      WIKIPULSE_MATCHING_SUMMARY_BATCHSIZE:      ${WIKIPULSE_MATCHING_SUMMARY_BATCHSIZE:-20}
      # 🔴 요약의 실제 비용 상한 (WP-165). BATCHSIZE 는 한 폴 크기일 뿐이라
      #    폴을 반복하면 미처리 전체를 훑는다 — 운영 4,474건 전수가 약 277,000 크레딧이다.
      #    스냅샷별 pulse_score 상위 N 만 요약해 LLM 실호출을 스냅샷 수 × N 으로 묶는다.
      #    0 = 무제한. ⚠️ 0 으로 두기 전에 운영 DB 로 예상 호출 수를 세어 본다.
      WIKIPULSE_MATCHING_SUMMARY_TOPPERSNAPSHOT: ${WIKIPULSE_MATCHING_SUMMARY_TOPPERSNAPSHOT:-10}
      # 🔴 SCHEDULER_SOURCE 와 **같은 값**이어야 한다. 근거는 그쪽 주석.
      WIKIPULSE_MATCHING_SUMMARY_SOURCE: ${WIKIPULSE_MATCHING_SUMMARY_SOURCE:-}
      # 🔴 SCHEDULER_SNAPSHOT_DAYS 와 **같은 값**이어야 한다 (WP-215).
      WIKIPULSE_MATCHING_SUMMARY_SNAPSHOT_DAYS: ${WIKIPULSE_MATCHING_SUMMARY_SNAPSHOT_DAYS:-}
      # 같은 model 로 요약 저장에 실패해도 되는 횟수 (WP-182).
      # 🔴 0 이하 = 무제한. 켜지 말 것 — 저장 못 하는 클러스터를 매 폴 다시 집는다.
      WIKIPULSE_MATCHING_SUMMARY_MAXATTEMPTS: ${WIKIPULSE_MATCHING_SUMMARY_MAXATTEMPTS:-3}
      # 하루 LLM 호출 상한 (WP-191). 🔴 0 이하 = 무제한, 켜지 말 것.
      WIKIPULSE_MATCHING_BUDGET_SUMMARYCALLS: ${WIKIPULSE_MATCHING_BUDGET_SUMMARYCALLS:-100}
      WIKIPULSE_MATCHING_BUDGET_VERIFICATIONCALLS: ${WIKIPULSE_MATCHING_BUDGET_VERIFICATIONCALLS:-300}
      # 🔴 이름이 claude- 로 시작하면 Anthropic, 아니면 OpenAI 경로다 (WP-172).
      #    검증 기본값이 gpt-5.4-nano 로 바뀌었다 — Sonnet 대비 9.8배 싸고 정답셋에서 오탐 0.
      #    되돌리려면 claude-sonnet-4-5-20250929 을 넣는다. 요약은 측정 안 해서 Sonnet 유지.
      WIKIPULSE_MATCHING_GATEWAY_VERIFICATIONMODEL: ${WIKIPULSE_MATCHING_GATEWAY_VERIFICATIONMODEL:-gpt-5.4-nano}
      WIKIPULSE_MATCHING_GATEWAY_SUMMARYMODEL:      ${WIKIPULSE_MATCHING_GATEWAY_SUMMARYMODEL:-claude-sonnet-4-5-20250929}
      # 문서 표시용 한국어 제목 채우기 워커 (WP-205, V20). 위 GATEWAY 워커들과 독립이다 —
      # 크레딧을 쓰지 않고(위키미디어 무료) GATEWAY 키도 필요 없다. 🔴 기본 꺼짐이며
      # **켜는 것이 곧 백필**이다: cluster_member 에 편입된 enwiki 문서 중 아직 조회 안 한
      # 것을 훑어 wiki_page.title_ko 를 채운다. 끄면 화면이 영문 제목으로 떨어질 뿐이다.
      WIKIPULSE_PAGETITLE_ENABLED: ${WIKIPULSE_PAGETITLE_ENABLED:-false}
      # 🔴 폴당 위키 요청 수는 이 값 / 50 이다 — langlinks 는 한 요청에 제목 50개까지고
      #    51개부터는 잘림이 아니라 toomanyvalues 에러다(2026-09-22 실측).
      #    기본 500 이면 폴당 10 요청으로 resilience4j wikipedia RateLimiter(초당 10)와 같은 자릿수.
      WIKIPULSE_PAGETITLE_BATCHSIZE: ${WIKIPULSE_PAGETITLE_BATCHSIZE:-500}
      # 2단 폴백 — Azure Translator (WP-205). ko.wikipedia 대응이 없는 문서만 번역한다.
      # 🔴 키는 저장소에 없다. 서버 .env 에만 둔다. 비어 있으면 번역을 건너뛰고 영문 표시다.
      # 🔴 번역 결과는 표시·검색 전용이며 ko.wikipedia 정식 제목이 아니다 — 위키 링크에 쓰지 않는다.
      AZURE_TRANSLATOR_KEY:       ${AZURE_TRANSLATOR_KEY:-}
      AZURE_TRANSLATOR_ENDPOINT:  ${AZURE_TRANSLATOR_ENDPOINT:-https://api.cognitive.microsofttranslator.com}
      AZURE_TRANSLATOR_REGION:    ${AZURE_TRANSLATOR_REGION:-}
      # F0 는 월 200만 자다. 한 폴에서 번역할 문서 수 상한 — 위키 조회와 별개 축이다.
      AZURE_TRANSLATOR_BATCHSIZE: ${AZURE_TRANSLATOR_BATCHSIZE:-200}
    # 열면 8080 이 외부에 직접 노출되고, 도커 게시 포트는 ufw 로 막히지도 않는다.

